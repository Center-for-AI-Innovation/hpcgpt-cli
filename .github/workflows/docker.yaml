name: Build and Push MCP Images
on:
  push:
    branches:
      - main
      - osc

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-osc-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Image Name
        run: |
          OWNER='${{ github.repository_owner }}'
          OWNER_LOWER="${OWNER,,}"
          echo "IMAGE_NAME=${OWNER_LOWER}/osc_chat_mcp" >> "$GITHUB_ENV"
      - name: Get release tag
        run: |
          echo "RELEASE_TAG=`cat OSC/mcp_servers/osc_chat_server/VERSION.txt`" >> "$GITHUB_ENV"
      - name: Check if image tag exists
        id: check-tag
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}"
          if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $IMAGE_TAG already exists. Skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $IMAGE_TAG does not exist. Proceeding..."
          fi
      - name: Create dummy config.json
        run: |
          cat << 'EOF' > OSC/mcp_servers/osc_chat_server/config.json
          {"osc_chat_url" : "", "osc_chat_api_key": "", "osc_chat_model": ""}
          EOF
      - name: Build and push image
        id: push
        if: steps.check-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: OSC/mcp_servers/osc_chat_server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
